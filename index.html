
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>

<!-- Add Babel Standalone -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin="anonymous"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",

</script>

<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans transition-colors duration-300">
    <div id="root">
      <div style="text-align: center; padding: 40px; font-family: Arial, sans-serif; color: #555;">
        Cargando aplicación... Si este mensaje persiste, revisa la consola del desarrollador (F12).
      </div>
    </div>

    <script>
      console.log('[DEBUG HTML] Attempting to fetch and transpile index.tsx');
      fetch('./index.tsx')
        .then(response => {
          console.log('[DEBUG HTML] fetch response status:', response.status);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status} while fetching index.tsx`);
          }
          return response.text();
        })
        .then(text => {
          console.log('[DEBUG HTML] index.tsx content fetched, length:', text.length);
          if (!Babel || !Babel.transform) {
            console.error('[DEBUG HTML] Babel or Babel.transform is not available!');
            document.getElementById('root').innerHTML = '<div style="color: red; font-size: 18px;">Error Crítico: Babel no está cargado. La aplicación no puede iniciar.</div>';
            throw new Error('Babel or Babel.transform not available');
          }
          console.log('[DEBUG HTML] Babel found. Attempting to transform index.tsx...');
          const { code } = Babel.transform(text, {
            presets: ['env', 'react', 'typescript'],
            sourceType: 'module' // Explicitly tell Babel it's a module
            // filename: 'index.tsx' // REMOVED to avoid potential issues with MIME type re-checking
          });
          console.log('[DEBUG HTML] Babel transformation complete. Executing transpiled code...');
          
          // Create a new script element to execute the transpiled code
          // This ensures it runs in the global scope and can access React/ReactDOM from importmap
          const script = document.createElement('script');
          script.type = 'module'; // Important for ES module syntax (import/export)
          script.textContent = code;
          document.body.appendChild(script);
          console.log('[DEBUG HTML] Transpiled code appended to body and should execute.');
        })
        .catch(error => {
          console.error('[DEBUG HTML] Error fetching or transpiling index.tsx:', error);
          const rootDiv = document.getElementById('root');
          if (rootDiv) {
            rootDiv.innerHTML = `<div style="color: red; padding: 20px; font-family: Arial, sans-serif;">
              <h2>Error al Cargar la Aplicación</h2>
              <p>No se pudo cargar o procesar el script principal (index.tsx).</p>
              <p><strong>Detalle:</strong> ${error.message}</p>
              <p>Por favor, asegúrate de que un servidor HTTP local está sirviendo esta página y revisa la consola del desarrollador para más información.</p>
            </div>`;
          }
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
      .dark ::-webkit-scrollbar-track { background: #2d3748; }
      ::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #4a5568; }
      ::-webkit-scrollbar-thumb:hover { background: #a0aec0; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #718096; }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 font-sans transition-colors duration-300">
    <div id="root">Cargando aplicación...</div>
